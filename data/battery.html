<!DOCTYPE HTML>
<html lang="en">
<head>
  <title>Battery Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="all.css">
  <link rel="stylesheet" type="text/css" href="sparkles.css">
  <link rel="icon" href="data:,">
  <script src="nav.js"></script>
</head>
<body>
  <div class="topnav">
    <h3>BATTERY STATUS</h3>
    <div class="hamburger" id="hamburgerMenu">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="nav-menu" id="navMenu"></div>
  </div>

  <div class="content">
    <table id="batteryTable">
      <thead>
        <tr>
          <th>Device</th>
          <th>Battery</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="batteryBody"></tbody>
    </table>
  </div>

  <style>
    #batteryTable {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    #batteryTable th, #batteryTable td {
      padding: 0.6rem 1rem;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    #batteryTable th {
      color: #aaa;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .battery-low { color: #e74c3c; font-weight: bold; }
    .battery-mid { color: #f39c12; }
    .battery-ok  { color: #2ecc71; }
    .inactive td { opacity: 0.4; }
  </style>

  <script type="module" src="battery.js"></script>
</body>
</html>
